<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F5;
    --panel:#FFFFFF;
    --panel-2:#F1F2EF;
    --border:#E3E6E1;
    --text:#20242A;
    --text-muted:#767C77;
    --gold:#B8863A;
    --gold-dim:#B8863A17;
    --accent:#2D6A4F;
    --accent-dim:#2D6A4F14;
    --accent2:#4A5FA8;
    --accent2-dim:#4A5FA814;
    --good:#2D6A4F;
    --bad:#B8453A;
    --bad-dim:#B8453A14;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,24,20,0.05), 0 1px 1px rgba(20,24,20,0.03);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Sora',sans-serif;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:520px;margin:0 auto;padding:20px 16px 60px;}

  .app-title{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .account-line{font-size:11.5px;color:var(--text-muted);margin-bottom:20px;}
  .account-line a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500;}

  .goals-row{display:flex;gap:24px;margin-bottom:6px;align-items:flex-end;flex-wrap:wrap;}
  .goal-item{min-width:80px;}
  .goal-label{font-size:11px;color:var(--text-muted);margin-bottom:2px;letter-spacing:0.01em;}
  .goal-number{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;line-height:1;}
  .goal-number .unit{font-size:12px;font-weight:500;color:var(--text-muted);margin-left:4px;}
  .goal-tick{width:26px;height:3px;border-radius:2px;margin-top:6px;}
  .goal-a .goal-number{color:var(--accent);}
  .goal-a .goal-tick{background:var(--accent);}
  .goal-b .goal-number{color:var(--accent2);}
  .goal-b .goal-tick{background:var(--accent2);}
  .goals-edit-link{font-size:11.5px;color:var(--text-muted);cursor:pointer;text-decoration:underline;margin-bottom:18px;display:inline-block;}
  .goals-edit-link:hover{color:var(--accent);}
  .goals-edit-panel{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:16px;}
  .goal-edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .goal-edit-row input[type=text]{flex:1.3;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;min-width:0;}
  .goal-edit-row input[type=date]{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 8px;font-family:'JetBrains Mono',monospace;font-size:12px;min-width:0;}
  .goal-remove-btn{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px 6px;line-height:1;flex-shrink:0;}
  .add-goal-btn{background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-top:2px;}
  .goals-empty{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;}

  .stat-line{font-size:12px;color:var(--text-muted);margin-bottom:20px;}
  .stat-line b{color:var(--text);font-weight:600;}
  .stat-line .dot{margin:0 6px;opacity:0.5;}

  .view-switch{display:flex;background:var(--panel-2);border-radius:11px;padding:3px;margin-bottom:18px;}
  .view-switch button{
    flex:1;padding:9px 0;border:none;background:transparent;color:var(--text-muted);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    border-radius:8px;cursor:pointer;
  }
  .view-switch button.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;}
  .tab{flex:1;min-width:76px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--text-muted);}
  .tab .d{font-weight:700;font-size:12.5px;letter-spacing:0.01em;}
  .tab .s{font-size:9.5px;display:block;margin-top:1px;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

  .date-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--text-muted);font-size:12.5px;}
  .date-row input[type=date]{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;}

  .info-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--text-muted);margin-bottom:12px;line-height:1.5;}
  .info-card b{color:var(--text);font-weight:600;}

  .ex-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:10px;box-shadow:var(--shadow);}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;gap:8px;}
  .ex-name{font-size:15px;font-weight:600;}
  .ex-target{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);white-space:nowrap;}
  .ex-suggested{font-size:11.5px;color:var(--text-muted);margin-bottom:10px;line-height:1.4;}
  .ex-ref{font-size:11px;color:var(--text-muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;}
  .ex-ref span b{color:var(--accent);font-weight:600;}

  .set-row{display:grid;grid-template-columns:20px 1fr auto 1fr 22px;gap:6px;align-items:center;margin-bottom:6px;}
  .set-row.time,.set-row.reps{grid-template-columns:20px 1fr 22px;}
  .set-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);text-align:center;}
  .set-row input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 6px;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;}
  .set-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .set-row .x{color:var(--text-muted);text-align:center;font-size:12px;}
  .remove-set{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:2px;}
  .add-set{background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:7px;padding:6px 10px;font-size:11.5px;cursor:pointer;margin-top:2px;margin-bottom:10px;}
  .notes-input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 9px;font-size:12.5px;font-family:'Inter',sans-serif;}
  .check-row{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;padding:6px 0;color:var(--text);}
  .check-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;}

  .save-bar{position:sticky;bottom:10px;margin-top:6px;}
  .save-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);}
  .save-btn:active{transform:scale(0.99);}
  .save-btn:disabled{opacity:0.45;cursor:default;}
  .backup-btn{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text-muted);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;margin-top:8px;}
  .backup-textarea{width:100%;min-height:140px;margin-top:10px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .toast{text-align:center;font-size:12.5px;margin-top:8px;min-height:16px;font-weight:500;}

  .milestone-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .milestone-title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .milestone-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:12px;}
  .stage{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .stage:first-of-type{border-top:none;}
  .stage input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}
  .stage-label{flex:1;font-size:13px;}
  .stage-label.done{color:var(--good);}
  .stage-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-muted);}

  .pr-wall{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
  .pr-item{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px;}
  .pr-item:first-of-type{border-top:none;}
  .pr-item .w{font-family:'JetBrains Mono',monospace;color:var(--gold);font-weight:700;}
  .pr-item .dt{color:var(--text-muted);font-size:11px;}
  .empty-state{color:var(--text-muted);font-size:12.5px;text-align:center;padding:14px 0;}

  .reset-btn{width:100%;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:10px;padding:11px;font-size:12px;cursor:pointer;margin-top:6px;}

  .loading{text-align:center;color:var(--text-muted);padding:60px 0;font-size:13px;}

  .auth-wrap{padding-top:48px;}
  .auth-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);}
  .auth-title{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;margin-bottom:4px;}
  .auth-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:20px;}
  .auth-field{margin-bottom:12px;}
  .auth-field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
  .auth-field input, .auth-field select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 10px;font-size:14px;}
  .auth-error{background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad);border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:12px;}
  .auth-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px;}
  .auth-toggle{text-align:center;font-size:12.5px;color:var(--text-muted);}
  .auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600;}
  .setup-warning{background:var(--gold-dim);border:1px solid var(--gold);color:#8A6220;border-radius:10px;padding:14px;font-size:12.5px;line-height:1.6;}

  .plan-day-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);}
  .plan-day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .plan-day-title{font-size:14.5px;font-weight:600;}
  .plan-day-count{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:6px;}
  .plan-day-actions{display:flex;gap:5px;flex-shrink:0;}
  .icon-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text-muted);border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;}
  .icon-btn.danger{color:var(--bad);border-color:#e2b8b3;}
  .icon-btn:disabled{opacity:0.35;cursor:default;}
  .plan-day-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .plan-ex-list{margin-top:6px;}
  .plan-ex-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
  .plan-ex-row:first-child{border-top:none;}
  .plan-ex-info{display:flex;flex-direction:column;min-width:0;}
  .plan-ex-name{font-size:13px;font-weight:500;}
  .plan-ex-meta{font-size:10.5px;color:var(--text-muted);}
  .plan-ex-actions{display:flex;gap:5px;flex-shrink:0;}
  .plan-ex-edit-form{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;}
  .plan-hint{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;}
  .done-btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:600;cursor:pointer;margin-top:4px;margin-right:6px;}
  .add-day-btn, .add-ex-btn{width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:10px;padding:11px;font-size:12.5px;cursor:pointer;margin-top:4px;}
  .plan-saved-indicator{text-align:center;font-size:12px;color:var(--good);padding:6px 0;}

  .typeahead-input{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:13.5px;margin-bottom:8px;}
  .typeahead-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);}
  .typeahead-item{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;font-size:13px;cursor:pointer;border-top:1px solid var(--border);}
  .typeahead-item:first-child{border-top:none;}
  .typeahead-item:active{background:var(--accent-dim);}
  .typeahead-meta{color:var(--text-muted);font-size:11px;white-space:nowrap;}
  .typeahead-empty{padding:10px;font-size:12px;color:var(--text-muted);text-align:center;}
  .typeahead-warning{font-size:11px;color:var(--gold);margin:2px 0 6px;}

  .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .hamburger-btn{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;}
  .ham-menu{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;margin:8px 0 16px;box-shadow:var(--shadow);}
  .ham-item{padding:11px 10px;font-size:13.5px;font-weight:500;color:var(--text);cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:9px;}
  .ham-item:active{background:var(--panel-2);}

  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-link{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;}
  .back-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .cal-month-label{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;}
  .cal-summary{font-size:12px;color:var(--text-muted);margin-bottom:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .cal-weekdays{margin-bottom:6px;}
  .cal-weekdays span{text-align:center;font-size:10.5px;color:var(--text-muted);font-weight:600;}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;position:relative;background:var(--panel);border:1px solid var(--border);}
  .cal-cell.empty{background:none;border:none;cursor:default;}
  .cal-daynum{font-size:12px;color:var(--text);}
  .cal-cell.today{border-color:var(--accent);border-width:1.5px;}
  .cal-cell.logged{border-color:transparent;}
  .cal-cell.logged.light{background:var(--accent-dim);}
  .cal-cell.logged.mid{background:#2D6A4F38;}
  .cal-cell.logged.full{background:var(--accent);}
  .cal-cell.logged.full .cal-daynum{color:#fff;font-weight:600;}
  .cal-dot{display:none;}
  .cal-legend{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:10.5px;color:var(--text-muted);}
  .cal-legend-swatch{width:12px;height:12px;border-radius:4px;}

  .meas-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .meas-label-input{flex:1.4;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;min-width:0;}
  .meas-value-input{flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 8px;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;min-width:0;}

  @media (prefers-reduced-motion: no-preference){
    .ex-card{transition:border-color .15s ease;}
  }
</style>
</head>

  var data = null;

  function todayISO(){
    var d = new Date();
    var local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,10);
  }
  function fmtDate(iso){
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function daysUntil(iso){
    var target = new Date(iso+'T00:00:00');
    var now = new Date();
    var nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((target - nowMid)/86400000);
  }
  function genId(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function escAttr(s){
    return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function typeLabel(t){
    return {weight:'Weight',time:'Timed',reps:'Reps',incline:'Incline',check:'Checklist'}[t] || t;
  }
  function typeOptionsHTML(current){
    var types = [['weight','Weight × Reps'],['time','Timed (seconds)'],['reps','Bodyweight Reps'],['incline','Incline height (lower = better)'],['check','Checklist (yoga/mobility)']];
    return types.map(function(t){ return '<option value="'+t[0]+'" '+(t[0]===current?'selected':'')+'>'+t[1]+'</option>'; }).join('');
  }
  function shortTabCode(day){
    var WD = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    if(day.weekday !== null && day.weekday !== undefined) return WD[day.weekday];
    return (day.label||'DAY').slice(0,3).toUpperCase();
  }
  function sortedLibraryEntries(library, excludeIds, query){
    var q = (query||'').trim().toLowerCase();
    var exclude = excludeIds || [];
    return Object.keys(library)
      .filter(function(id){ return exclude.indexOf(id)===-1; })
      .map(function(id){ return {id:id, def:library[id]}; })
      .filter(function(it){ return !q || it.def.name.toLowerCase().indexOf(q) !== -1; })
      .sort(function(a,b){ return a.def.name.localeCompare(b.def.name); });
  }

  function buildPlanFromDefaults(){
    var order = [], days = {}, library = {};
    Object.keys(DEFAULT_EXERCISES).forEach(function(key){
      var d = DEFAULT_EXERCISES[key];
      order.push(key);
      var ids = [];
      d.list.forEach(function(ex){
        library[ex.id] = {name:ex.name, type:ex.type, sets:ex.sets||1, target:ex.target, suggested:ex.suggested||''};
        ids.push(ex.id);
      });
      days[key] = {label:d.label, weekday:(d.weekday!==undefined?d.weekday:null), warmup:d.warmup||'', cooldown:d.cooldown||'', note:d.note||'', exerciseIds:ids};
    });
    EXTRA_LIBRARY_EXERCISES.forEach(function(ex){
      if(!library[ex.id]) library[ex.id] = {name:ex.name, type:ex.type, sets:ex.sets||1, target:ex.target, suggested:ex.suggested||''};
    });
    return {plan:{order:order, days:days}, library:library};
  }

  function defaultData(){
    var seeded = buildPlanFromDefaults();
    return {plan:seeded.plan, library:seeded.library, sessions:{}, milestones:{pushup:{}, pullup:{}}, prs:[], goals:[], measurements:{unit:'in', defs: DEFAULT_MEASUREMENT_DEFS.slice(), entries:{}}};
  }

  function getDay(dayKey){ return data.plan.days[dayKey]; }
  function getDraftDay(dayKey){ return planDraft.plan.days[dayKey]; }
  function exObj(exId){
    var def = data.library[exId];
    if(!def) return null;
    return {id:exId, name:def.name, type:def.type, sets:def.sets, target:def.target, suggested:def.suggested};
  }
  function computeDefaultDay(){
    var idx = new Date().getDay();
    var found = data.plan.order.find(function(k){ return data.plan.days[k].weekday === idx; });
    return found || data.plan.order[0] || null;
  }
  function cloneForDraft(){
    return {
      plan: JSON.parse(JSON.stringify(data.plan)),
      library: JSON.parse(JSON.stringify(data.library)),
      pendingMerges: []
    };
  }
  function ensureDraft(){
    if(!planDraft) planDraft = cloneForDraft();
  }

  async function loadData(){
    try{
      var doc = await db.collection('users').doc(currentUser.uid).collection('journal').doc('data').get();
      var d = (doc.exists && doc.data().payload) ? JSON.parse(doc.data().payload) : null;
      if(!d) return defaultData();
      if(!d.plan || !d.library){
        var seeded = buildPlanFromDefaults();
        d.plan = d.plan || seeded.plan;
        d.library = d.library || seeded.library;
      }
      if(!d.milestones) d.milestones = {pushup:{}, pullup:{}};
      if(!d.prs) d.prs = [];
      if(!d.sessions) d.sessions = {};
      if(!d.goals) d.goals = LEGACY_GOALS.slice();
      if(!d.measurements) d.measurements = {unit:'in', defs: DEFAULT_MEASUREMENT_DEFS.slice(), entries:{}};
      return d;
    }catch(e){
      return defaultData();
    }
  }
  async function persist(){
    if(!currentUser) return {ok:false, error:'Not signed in.'};
    try{
      await db.collection('users').doc(currentUser.uid).collection('journal').doc('data').set({
        payload: JSON.stringify(data),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return {ok:true};
    }catch(e){
      return {ok:false, error: (e && e.message) ? e.message : String(e)};
    }
  }

  function sessionKey(date, day){ return date + '__' + day; }

  // History/PRs are tracked globally per exercise (not scoped to a single
  // day) — the same exercise done on two different days shares one history.
  function allSessionsForExercise(exId){
    var out = [];
    for(var key in data.sessions){
      var s = data.sessions[key];
      if(s.exercises && s.exercises[exId]){
        out.push({date:s.date, day:s.day, entry:s.exercises[exId]});
      }
    }
    out.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    return out;
  }
  function bestMetricValue(exId, type){
    var hist = allSessionsForExercise(exId);
    var best = 0;
    hist.forEach(function(h){
      (h.entry.sets||[]).forEach(function(s){
        var v = type==='weight' ? s.weight : (type==='time' ? s.seconds : s.reps);
        if(v && v > best) best = v;
      });
    });
    return best;
  }
  // Incline height: LOWER is better (0 = floor / full push-up), so it needs
  // its own min-tracking logic and a null sentinel — 0 is a real, meaningful
  // value here, unlike weight/time/reps where 0 always just means "no data".
  function bestInclineHeight(exId){
    var hist = allSessionsForExercise(exId);
    var best = null;
    hist.forEach(function(h){
      (h.entry.sets||[]).forEach(function(s){
        if(s.height!=null && s.reps>0){
          if(best===null || s.height < best) best = s.height;
        }
      });
    });
    return best;
  }
  function prMetricType(p){ return p.type || 'weight'; }
  function prMetricValue(p){ return p.value!=null ? p.value : p.weight; }
  function prUnitSuffix(type){
    return type==='time' ? 's' : (type==='reps' ? ' reps' : (type==='incline' ? '' : ' lb'));
  }
  function prDisplayText(p){
    var t = prMetricType(p);
    var v = prMetricValue(p);
    if(t==='incline') return 'Height ' + v + (v===0 ? ' — floor! 🎉' : '');
    return v + prUnitSuffix(t);
  }

  function summarizeSets(ex, sets){
    if(!sets || !sets.length) return '—';
    if(ex.type==='weight') return sets.map(function(s){ return (s.weight!=null?s.weight:'?')+'×'+(s.reps!=null?s.reps:'?'); }).join(', ');
    if(ex.type==='time') return sets.map(function(s){ return (s.seconds!=null?s.seconds:'?')+'s'; }).join(', ');
    if(ex.type==='incline') return sets.map(function(s){ return 'H'+(s.height!=null?s.height:'?')+'×'+(s.reps!=null?s.reps:'?'); }).join(', ');
    return sets.map(function(s){ return (s.reps!=null?s.reps:'?'); }).join(', ');
  }

  function setRowHTML(ex, idx, prefill){
    var num = '<span class="set-num">'+(idx+1)+'</span>';
    if(ex.type==='weight'){
      return '<div class="set-row weight">'+num+
        '<input type="number" step="0.5" inputmode="decimal" class="inp-weight" placeholder="lb" value="'+(prefill&&prefill.weight!=null?prefill.weight:'')+'">'+
        '<span class="x">×</span>'+
        '<input type="number" step="1" inputmode="numeric" class="inp-reps" placeholder="reps" value="'+(prefill&&prefill.reps!=null?prefill.reps:'')+'">'+
        '<button class="remove-set" type="button" aria-label="Remove set" onclick="this.parentElement.remove()">✕</button></div>';
    }
    if(ex.type==='time'){
      return '<div class="set-row time">'+num+
        '<input type="number" step="1" inputmode="numeric" class="inp-seconds" placeholder="sec" value="'+(prefill&&prefill.seconds!=null?prefill.seconds:'')+'">'+
        '<button class="remove-set" type="button" aria-label="Remove set" onclick="this.parentElement.remove()">✕</button></div>';
    }
    if(ex.type==='incline'){
      return '<div class="set-row incline">'+num+
        '<input type="number" step="1" inputmode="numeric" class="inp-height" placeholder="height" value="'+(prefill&&prefill.height!=null?prefill.height:'')+'">'+
        '<span class="x">×</span>'+
        '<input type="number" step="1" inputmode="numeric" class="inp-reps" placeholder="reps" value="'+(prefill&&prefill.reps!=null?prefill.reps:'')+'">'+
        '<button class="remove-set" type="button" aria-label="Remove set" onclick="this.parentElement.remove()">✕</button></div>';
    }
    return '<div class="set-row reps">'+num+
      '<input type="number" step="1" inputmode="numeric" class="inp-reps" placeholder="reps" value="'+(prefill&&prefill.reps!=null?prefill.reps:'')+'">'+
      '<button class="remove-set" type="button" aria-label="Remove set" onclick="this.parentElement.remove()">✕</button></div>';
  }

  function dayContextNote(entryDay){
    if(!entryDay || entryDay===activeDay) return '';
    var d = data.plan.days[entryDay];
    return d ? ' · '+shortTabCode(d) : '';
  }

  function renderCheckCard(ex, date){
    var hist = allSessionsForExercise(ex.id);
    var last = hist.find(function(h){ return !(h.date === date && h.day === activeDay); }) || null;
    var curKey = sessionKey(date, activeDay);
    var existing = data.sessions[curKey] && data.sessions[curKey].exercises[ex.id];
    var checked = existing ? !!existing.done : false;

    var refHTML = '';
    if(last) refHTML = '<div class="ex-ref"><span>Last (' + fmtDate(last.date) + dayContextNote(last.day) + '): <b>' + (last.entry.done?'Done':'Skipped') + '</b></span></div>';

    return '<div class="ex-card" id="card-'+ex.id+'" data-exid="'+ex.id+'" data-type="check">'+
      '<div class="ex-head"><span class="ex-name">'+escAttr(ex.name)+'</span><span class="ex-target">'+escAttr(ex.target)+'</span></div>'+
      '<div class="ex-suggested">'+escAttr(ex.suggested)+'</div>'+
      refHTML+
      '<label class="check-row"><input type="checkbox" id="chk-'+ex.id+'" '+(checked?'checked':'')+'><span>Completed</span></label>'+
      '<input type="text" class="notes-input" id="notes-'+ex.id+'" placeholder="Notes (optional)" value="'+((existing&&existing.notes)?escAttr(existing.notes):'')+'" style="margin-top:8px;">'+
    '</div>';
  }

  function renderExerciseCard(ex, date){
    if(ex.type === 'check') return renderCheckCard(ex, date);

    var hist = allSessionsForExercise(ex.id);
    var last = hist.find(function(h){ return !(h.date === date && h.day === activeDay); }) || null;
    var best = ex.type==='incline' ? bestInclineHeight(ex.id) : bestMetricValue(ex.id, ex.type);
    var hasBest = ex.type==='incline' ? (best !== null) : (best > 0);
    var curKey = sessionKey(date, activeDay);
    var existing = data.sessions[curKey] && data.sessions[curKey].exercises[ex.id];

    var rowsHTML = '';
    var n = existing ? existing.sets.length : ex.sets;
    if(n < 1) n = ex.sets;
    for(var i=0;i<n;i++){
      rowsHTML += setRowHTML(ex, i, existing ? existing.sets[i] : null);
    }

    var refHTML = '<div class="ex-ref">';
    if(last) refHTML += '<span>Last (' + fmtDate(last.date) + dayContextNote(last.day) + '): <b>' + summarizeSets(ex, last.entry.sets) + '</b></span>';
    if(hasBest){
      if(ex.type==='incline') refHTML += '<span>Best height: <b>'+best+(best===0?' — floor! 🎉':'')+'</b></span>';
      else refHTML += '<span>Best: <b>'+best+prUnitSuffix(ex.type)+'</b></span>';
    }
    if(!last && !hasBest) refHTML = '<div class="ex-ref"><span style="color:var(--text-muted)">First time logging this one — set your baseline.</span>';
    refHTML += '</div>';

    return '<div class="ex-card" id="card-'+ex.id+'" data-exid="'+ex.id+'" data-type="'+ex.type+'">'+
      '<div class="ex-head"><span class="ex-name">'+escAttr(ex.name)+'</span><span class="ex-target">'+ex.sets+'×'+escAttr(ex.target)+'</span></div>'+
      '<div class="ex-suggested">'+escAttr(ex.suggested)+'</div>'+
      refHTML+
      '<div class="sets-container" id="sets-'+ex.id+'">'+rowsHTML+'</div>'+
      '<button type="button" class="add-set" onclick="App.addSet(\''+ex.id+'\')">+ Add set</button>'+
      '<input type="text" class="notes-input" id="notes-'+ex.id+'" placeholder="Notes (optional)" value="'+((existing&&existing.notes)?escAttr(existing.notes):'')+'">'+
    '</div>';
  }

  function renderLogView(){
    if(!activeDay || !data.plan.days[activeDay]) activeDay = computeDefaultDay();
    if(!activeDay){
      return '<div class="empty-state">You don\'t have any days in your plan yet. Head to the Plan tab to add one.</div>';
    }
    var day = getDay(activeDay);
    var html = '';

    html += '<div class="tabs">';
    data.plan.order.forEach(function(d){
      var dd = getDay(d);
      html += '<div class="tab'+(d===activeDay?' active':'')+'" onclick="App.setDay(\''+d+'\')"><span class="d">'+shortTabCode(dd)+'</span><span class="s">'+escAttr(dd.label)+'</span></div>';
    });
    html += '</div>';

    html += '<div class="date-row">Logging for <input type="date" id="dateInput" value="'+activeDate+'" onchange="App.setDate(this.value)"></div>';
    if(day.warmup) html += '<div class="info-card"><b>Warm-up:</b> '+escAttr(day.warmup)+'</div>';
    if(day.note) html += '<div class="info-card">'+escAttr(day.note)+'</div>';

    if(!day.exerciseIds.length){
      html += '<div class="empty-state">No exercises on this day yet — add some from the Plan tab.</div>';
    }
    day.exerciseIds.forEach(function(exId){
      var ex = exObj(exId);
      if(!ex) return;
      html += renderExerciseCard(ex, activeDate);
    });

    if(day.cooldown) html += '<div class="info-card"><b>Cool-down:</b> '+escAttr(day.cooldown)+'</div>';
    html += '<div class="save-bar"><button class="save-btn" onclick="App.saveDay()">Save Workout</button>'+
      '<button class="backup-btn" onclick="App.showBackup()">Show as text (backup)</button>'+
      '<div class="toast" id="toast"></div><div id="backupBox"></div></div>';

    return html;
  }

  function renderMilestones(){
    var html = '';

    html += '<div class="milestone-block"><div class="milestone-title">Push-Up Progression</div><div class="milestone-sub">Check off each stage as you land it.</div>';
    PUSHUP_STAGES.forEach(function(label, i){
      var done = data.milestones.pushup[i];
      html += '<div class="stage"><input type="checkbox" '+(done?'checked':'')+' onchange="App.toggleMilestone(\'pushup\','+i+',this.checked)">'+
        '<span class="stage-label'+(done?' done':'')+'">'+label+'</span>'+
        (done?'<span class="stage-date">'+fmtDate(done)+'</span>':'')+'</div>';
    });
    html += '</div>';

    html += '<div class="milestone-block"><div class="milestone-title">Pull-Up Progression</div><div class="milestone-sub">Check off each stage as you land it.</div>';
    PULLUP_STAGES.forEach(function(label, i){
      var done = data.milestones.pullup[i];

  function ensureCalendarMonth(){
    if(!calendarMonth){
      var now = new Date();
      calendarMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    }
  }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function datesWithSessionsInfo(){
    var map = {};
    Object.values(data.sessions).forEach(function(s){
      if(!map[s.date]) map[s.date] = {count:0, day:s.day};
      map[s.date].count += Object.keys(s.exercises||{}).length;
    });
    return map;
  }

  function renderCalendarView(){
    ensureCalendarMonth();
    var y = calendarMonth.getFullYear();
    var mo = calendarMonth.getMonth();
    var monthLabel = calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    var firstDay = new Date(y, mo, 1);
    var startOffset = (firstDay.getDay()+6)%7; // Monday=0 offset
    var daysInMonth = new Date(y, mo+1, 0).getDate();
    var sessMap = datesWithSessionsInfo();
    var todayStr = todayISO();

    var monthCount = 0;
    Object.keys(sessMap).forEach(function(d){
      var dd = new Date(d+'T00:00:00');
      if(dd.getFullYear()===y && dd.getMonth()===mo) monthCount++;
    });

    var html = '';
    html += '<div class="cal-header"><button class="icon-btn" onclick="App.calendarMonthShift(-1)">‹</button><div class="cal-month-label">'+monthLabel+'</div><button class="icon-btn" onclick="App.calendarMonthShift(1)">›</button></div>';
    html += '<div class="cal-summary">'+monthCount+' workout'+(monthCount===1?'':'s')+' logged this month</div>';
    html += '<div class="cal-grid cal-weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>';
    html += '<div class="cal-grid">';
    for(var i=0;i<startOffset;i++) html += '<div class="cal-cell empty"></div>';
    for(var day=1; day<=daysInMonth; day++){
      var dateStr = y+'-'+pad2(mo+1)+'-'+pad2(day);
      var info = sessMap[dateStr];
      var isToday = dateStr===todayStr;
      var tier = info ? (info.count>=6 ? 'full' : (info.count>=3 ? 'mid' : 'light')) : '';
      html += '<div class="cal-cell'+(isToday?' today':'')+(info?' logged '+tier:'')+'" onclick="App.calendarDayClick(\''+dateStr+'\')">'+
        '<span class="cal-daynum">'+day+'</span></div>';
    }
    html += '</div>';
    html += '<div class="cal-legend"><span class="cal-legend-swatch" style="background:var(--accent-dim);"></span> a little'+
      '<span class="cal-legend-swatch" style="background:#2D6A4F38;margin-left:8px;"></span> some'+
      '<span class="cal-legend-swatch" style="background:var(--accent);margin-left:8px;"></span> full session</div>';
    html += '<div class="plan-hint" style="margin-top:12px;">Tap any day to view or log it, whether or not it already has an entry.</div>';
    return html;
  }

  function computeChangeSinceFirst(defId){
    var entries = data.measurements.entries || {};
    var dates = Object.keys(entries).filter(function(d){ return entries[d][defId]!=null; }).sort();
    if(!dates.length) return null;
    var first = entries[dates[0]][defId];
    var last = entries[dates[dates.length-1]][defId];
    return {first:first, last:last, diff: Math.round((last-first)*100)/100, firstDate:dates[0], lastDate:dates[dates.length-1], count:dates.length};
  }

      html += '<div class="empty-state">Add a measurement above to start tracking.</div>';
    } else {
      m.defs.forEach(function(def){
        var change = computeChangeSinceFirst(def.id);
        html += '<div class="pr-item"><span>'+escAttr(def.label)+'</span>';
        if(change && change.count>1){
          var sign = change.diff>0?'+':'';
          html += '<span class="w">'+change.last+' '+m.unit+' <span class="dt">'+sign+change.diff+' '+m.unit+' since '+fmtDate(change.firstDate)+'</span></span>';
        } else if(change){
          html += '<span class="dt">'+change.last+' '+m.unit+' logged '+fmtDate(change.firstDate)+' — log again to see a trend</span>';
        } else {
          html += '<span class="dt">Not logged yet</span>';
        }
        html += '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function buildTextExport(){
    var lines = [];
    lines.push('TRAINING LOG EXPORT');
    lines.push('Generated ' + todayISO());
    lines.push('');

    if(data.goals && data.goals.length){
      lines.push('GOALS');
      data.goals.forEach(function(g){
        lines.push('- ' + g.label + ': ' + g.date + ' (' + daysUntil(g.date) + ' days away)');
      });
      lines.push('');
    }

    lines.push('CURRENT PLAN');
    var wdNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    data.plan.order.forEach(function(dk){
      var day = data.plan.days[dk];
      lines.push(day.label + (day.weekday!=null ? ' ['+wdNames[day.weekday]+']' : ''));
      day.exerciseIds.forEach(function(exId){
        var def = data.library[exId];
        if(!def) return;
        var targetStr = def.type==='check' ? def.target : (def.sets+'x'+def.target);
        lines.push('  - ' + def.name + ': ' + targetStr + (def.suggested ? ' (' + def.suggested + ')' : ''));
      });
      lines.push('');
    });

    lines.push('PERSONAL RECORDS');
    var prs = (data.prs||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
    if(!prs.length){ lines.push('(none yet)'); }
    prs.forEach(function(p){
      lines.push('- ' + p.exName + ': ' + prDisplayText(p) + ' (' + p.date + ')');
    });
    lines.push('');

    lines.push('WORKOUT HISTORY (chronological)');
    var sessionKeys = Object.keys(data.sessions).sort(function(a,b){
      var da = data.sessions[a].date, db = data.sessions[b].date;
      return da<db?-1:(da>db?1:0);
    });
    if(!sessionKeys.length){ lines.push('(no workouts logged yet)'); }
    sessionKeys.forEach(function(sk){
      var s = data.sessions[sk];
      var dayLabel = data.plan.days[s.day] ? data.plan.days[s.day].label : s.day;
      lines.push(s.date + ' — ' + dayLabel);
      Object.keys(s.exercises||{}).forEach(function(exId){
        var def = data.library[exId];
        var name = def ? def.name : exId;
        var entry = s.exercises[exId];
        var valStr;
        if(entry.sets){
          valStr = summarizeSets({type: def ? def.type : 'weight'}, entry.sets);
        } else {
          valStr = entry.done ? 'Done' : 'Not done';
        }
        lines.push('  ' + name + ': ' + valStr + (entry.notes ? ' — ' + entry.notes : ''));
      });
    });
    lines.push('');

    if(data.measurements && data.measurements.defs && data.measurements.defs.length){
      lines.push('BODY MEASUREMENTS');
      data.measurements.defs.forEach(function(def){
        var change = computeChangeSinceFirst(def.id);
        if(change){
          var sign = change.diff>0?'+':'';
          lines.push('- ' + def.label + ': ' + change.last + ' ' + data.measurements.unit + ' (started ' + change.first + ' ' + data.measurements.unit + ' on ' + change.firstDate + ', change ' + sign + change.diff + ' ' + data.measurements.unit + ')');
        }
      });
      lines.push('');
    }

    return lines.join('\n');
  }

  function downloadFile(filename, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function gatherSets(ex){
    var container = document.getElementById('sets-'+ex.id);
    var rows = container.querySelectorAll('.set-row');
    var out = [];
    rows.forEach(function(row){
      if(ex.type==='weight'){
        var w = row.querySelector('.inp-weight').value;
        var r = row.querySelector('.inp-reps').value;
        if(w!=='' || r!==''){
          out.push({weight: w===''?null:parseFloat(w), reps: r===''?null:parseInt(r,10)});
        }
      } else if(ex.type==='time'){
        var s = row.querySelector('.inp-seconds').value;
        if(s!=='') out.push({seconds: parseInt(s,10)});
      } else if(ex.type==='incline'){
        var h = row.querySelector('.inp-height').value;
        var ir = row.querySelector('.inp-reps').value;
        if(h!=='' || ir!==''){
          out.push({height: h===''?null:parseInt(h,10), reps: ir===''?null:parseInt(ir,10)});
        }
      } else {
        var rr = row.querySelector('.inp-reps').value;
        if(rr!=='') out.push({reps: parseInt(rr,10)});
      }
    });
    return out;
  }

    saveDay: function(){
      var day = getDay(activeDay);
      var key = sessionKey(activeDate, activeDay);
      var exercisesOut = {};
      var newPRs = [];

      day.exerciseIds.forEach(function(exId){
        var ex = exObj(exId);
        if(!ex) return;
        var notesEl = document.getElementById('notes-'+ex.id);
        var notes = notesEl ? notesEl.value : '';

        if(ex.type === 'check'){
          var chkEl = document.getElementById('chk-'+ex.id);
          var done = chkEl ? chkEl.checked : false;
          if(!done && !notes) return;
          exercisesOut[ex.id] = {done: done, notes: notes};
          return;
        }

        var sets = gatherSets(ex);
        if(sets.length === 0 && !notes) return;
        exercisesOut[ex.id] = {sets: sets, notes: notes};

        if((ex.type==='weight' || ex.type==='time' || ex.type==='reps') && sets.length){
          var prevBest = bestMetricValue(ex.id, ex.type);
          var newMax = 0;
          sets.forEach(function(s){
            var v = ex.type==='weight' ? s.weight : (ex.type==='time' ? s.seconds : s.reps);
            if(v && v>newMax) newMax = v;
          });
          if(newMax>prevBest){
            data.prs = (data.prs||[]).filter(function(p){ return !(p.exId===ex.id && p.date===activeDate); });
            var pr = {exId:ex.id, exName:ex.name, type:ex.type, value:newMax, date:activeDate};
            data.prs.push(pr);
            newPRs.push(pr);
          }
        } else if(ex.type==='incline' && sets.length){
          var prevBestH = bestInclineHeight(ex.id);
          var newMinH = null;
          sets.forEach(function(s){
            if(s.height!=null && s.reps>0){
              if(newMinH===null || s.height<newMinH) newMinH = s.height;
            }
          });
          if(newMinH!==null && (prevBestH===null || newMinH<prevBestH)){
            data.prs = (data.prs||[]).filter(function(p){ return !(p.exId===ex.id && p.date===activeDate); });
            var incPr = {exId:ex.id, exName:ex.name, type:'incline', value:newMinH, date:activeDate};
            data.prs.push(incPr);
            newPRs.push(incPr);
          }
        }
      });

      data.sessions[key] = {date: activeDate, day: activeDay, exercises: exercisesOut};

      persist().then(function(result){
        render();
        var toast = document.getElementById('toast');
        if(!result.ok){
          if(toast){ toast.style.color = 'var(--bad)'; toast.textContent = "Couldn't save: " + result.error; }
          return;
        }
        var msg = 'Workout saved';
        if(newPRs.length) msg += ' · ' + newPRs.length + ' new PR' + (newPRs.length>1?'s':'') + ' 🎉';
        if(toast){ toast.style.color = 'var(--good)'; toast.textContent = msg; }
        setTimeout(function(){
          var t = document.getElementById('toast');
          if(t) t.textContent = '';
        }, 4000);
      });
    },
    showBackup: function(){
      var day = getDay(activeDay);
      var lines = ['Workout — ' + shortTabCode(day) + ' ' + activeDate, ''];
      day.exerciseIds.forEach(function(exId){
        var ex = exObj(exId);
        if(!ex) return;
        var notesEl = document.getElementById('notes-'+ex.id);
        var notes = notesEl ? notesEl.value : '';
        if(ex.type === 'check'){
          var chkEl = document.getElementById('chk-'+ex.id);
          var done = chkEl ? chkEl.checked : false;
          if(!done && !notes) return;
          lines.push(ex.name + ': ' + (done?'Done':'Not done') + (notes ? ' — ' + notes : ''));
          return;
        }
        var sets = gatherSets(ex);
        if(!sets.length && !notes) return;
        lines.push(ex.name + ': ' + summarizeSets(ex, sets) + (notes ? ' — ' + notes : ''));
      });
      if(lines.length === 2){ lines.push('(Nothing entered yet)'); }
      var box = document.getElementById('backupBox');

    resetAll: function(){
      if(!confirm('This will permanently delete all logged workouts, milestones, and PRs. Continue?')) return;
      data = defaultData();
      persist().then(function(){ activeDay = computeDefaultDay(); render(); });
    },
    rebuildPRs: function(){
      if(!confirm('Recalculate all PRs from your full logged history? This fills in any PRs missed by a past bug — it won\'t remove valid PRs, just recomputes everything from your actual logged sets.')) return;
      var sessions = Object.values(data.sessions||{}).slice().sort(function(a,b){
        return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
      });
      var bestSoFar = {};
      var rebuilt = [];
      sessions.forEach(function(s){
        Object.keys(s.exercises||{}).forEach(function(exId){
          var entry = s.exercises[exId];
          if(!entry.sets) return;
          var def = data.library[exId];
          var type = def ? def.type : 'weight';
          if(type==='incline'){
            var minInSession = null;
            entry.sets.forEach(function(set){
              if(set.height!=null && set.reps>0){
                if(minInSession===null || set.height<minInSession) minInSession = set.height;
              }
            });
            if(minInSession===null) return;
            var prevBestH = bestSoFar.hasOwnProperty(exId) ? bestSoFar[exId] : null;
            if(prevBestH===null || minInSession<prevBestH){
              bestSoFar[exId] = minInSession;
              var exNameInc = def ? def.name : exId;
              rebuilt.push({exId:exId, exName:exNameInc, type:'incline', value:minInSession, date:s.date});
            }
            return;
          }
          if(type!=='weight' && type!=='time' && type!=='reps') return;
          var maxInSession = 0;
          entry.sets.forEach(function(set){
            var v = type==='weight' ? set.weight : (type==='time' ? set.seconds : set.reps);
            if(v && v > maxInSession) maxInSession = v;
          });
          if(maxInSession <= 0) return;
          var prevBest = bestSoFar[exId] || 0;
          if(maxInSession > prevBest){
            bestSoFar[exId] = maxInSession;
            var exName = def ? def.name : exId;
            rebuilt.push({exId:exId, exName:exName, type:type, value:maxInSession, date:s.date});
          }
        });
      });
      data.prs = rebuilt;
      persist().then(function(result){
        render();
        var toast = document.getElementById('milestoneToast');
        if(!result.ok){
          if(toast){ toast.style.color='var(--bad)'; toast.textContent = "Couldn't save: "+result.error; }
          return;
        }
        if(toast){ toast.style.color='var(--good)'; toast.textContent = 'Rebuilt '+rebuilt.length+' PR'+(rebuilt.length===1?'':'s')+' from history ✓'; }
        setTimeout(function(){
          var t = document.getElementById('milestoneToast');
          if(t) t.textContent = '';
        }, 4000);
      });
    },

      var removeDef = planDraft.library[removeId];
      var keepDef = planDraft.library[keepId];
      if(!confirm('Merge "'+removeDef.name+'" into "'+keepDef.name+'"? Their logged history and PRs will combine under "'+keepDef.name+'" once you save. This can\'t be undone after saving.')) return;
      planDraft.plan.order.forEach(function(dk){
        var day = planDraft.plan.days[dk];
        var idx = day.exerciseIds.indexOf(removeId);
        if(idx!==-1){
          if(day.exerciseIds.indexOf(keepId)===-1){
            day.exerciseIds[idx] = keepId;
          } else {
            day.exerciseIds.splice(idx,1);
          }
        }
      });
      delete planDraft.library[removeId];
      planDraft.pendingMerges.push({removeId:removeId, keepId:keepId});
      planUI.mergingEx = null;
      planDirty = true;
      render();
    },
    deleteFromLibrary: function(exId){
      ensureDraft();
      var def = planDraft.library[exId];
      var usedOn = planDraft.plan.order.filter(function(dk){ return getDraftDay(dk).exerciseIds.indexOf(exId)!==-1; });
      var msg = 'Permanently delete "'+(def?def.name:exId)+'" from your library?';
      if(usedOn.length) msg += ' It will also be removed from '+usedOn.length+' day(s) on your plan.';
      msg += ' Its logged history will no longer be viewable in the app once you save.';
      if(!confirm(msg)) return;
      planDraft.plan.order.forEach(function(dk){
        var day = planDraft.plan.days[dk];
        day.exerciseIds = day.exerciseIds.filter(function(id){ return id!==exId; });
      });
      delete planDraft.library[exId];
      planDirty = true;
      render();
    },
    savePlan: function(){
      data.plan = planDraft.plan;
      data.library = planDraft.library;

      (planDraft.pendingMerges||[]).forEach(function(m){
        Object.keys(data.sessions).forEach(function(sk){
          var s = data.sessions[sk];
          if(s.exercises && s.exercises[m.removeId]){
            if(!s.exercises[m.keepId]) s.exercises[m.keepId] = s.exercises[m.removeId];
            delete s.exercises[m.removeId];
          }
        });
        data.prs = (data.prs||[]).map(function(p){
          if(p.exId === m.removeId){
            p.exId = m.keepId;
            p.exName = data.library[m.keepId] ? data.library[m.keepId].name : p.exName;
          }
          return p;
        });
        var seenBest = {};
        data.prs = data.prs.filter(function(p){
          var k = p.exId+'|'+p.date;
          if(seenBest[k]===undefined || p.weight > seenBest[k]){ seenBest[k]=p.weight; return true; }
          return false;
        });
      });

      (data.prs||[]).forEach(function(p){
        if(data.library[p.exId]) p.exName = data.library[p.exId].name;
      });
      persist().then(function(result){
        var toast = document.getElementById('planToast');
        if(!result.ok){
          if(toast){ toast.style.color='var(--bad)'; toast.textContent = "Couldn't save: "+result.error; }
          return;
        }
        planDirty = false;
        if(!activeDay || !data.plan.days[activeDay]) activeDay = computeDefaultDay();
        render();
        var t = document.getElementById('planToast');
        if(t){ t.style.color='var(--good)'; t.textContent = 'Plan saved ✓'; }
        setTimeout(function(){
          var t2 = document.getElementById('planToast');
          if(t2) t2.textContent = '';
        }, 3000);
      });
    },
    discardPlan: function(){
      if(!confirm('Discard all unsaved plan changes?')) return;
      planDraft = cloneForDraft();
      planDirty = false;
      planUI = {expandedDay:null, addingExercise:false, addMode:'library', editingEx:null, showLibrary:false, mergingEx:null};
      render();
    },

    toggleAuthMode: function(){
      authMode = authMode==='login' ? 'signup' : 'login';
      authError = '';
      render();
    },
    submitAuth: function(){
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value;
      authError = '';
      if(!email || !password){ authError = 'Enter both an email and password.'; render(); return; }
      if(password.length < 6){ authError = 'Password must be at least 6 characters.'; render(); return; }
      authBusy = true; render();
      var action = authMode==='login'
        ? auth.signInWithEmailAndPassword(email, password)
        : auth.createUserWithEmailAndPassword(email, password);
      action.catch(function(e){
        authError = e.message || 'Something went wrong. Try again.';
      }).finally(function(){
        authBusy = false; render();
      });
    },
    toggleGoalsEdit: function(){
      editingGoals = !editingGoals;
      render();
    },
    updateGoal: function(id, field, value){
      var g = (data.goals||[]).find(function(x){ return x.id===id; });
      if(!g) return;
      if(field==='label') g.label = (value||'').trim() || g.label;
      else g.date = value;
      persist();
      render();
    },
    addGoal: function(){
      if(!data.goals) data.goals = [];
      if(data.goals.length >= 2) return;
      var d = new Date();
      d.setMonth(d.getMonth()+3);
      var defaultDate = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
      data.goals.push({id: genId('goal'), label:'New Goal', date: defaultDate});
      persist();
      render();
    },
    removeGoal: function(id){
      data.goals = (data.goals||[]).filter(function(g){ return g.id!==id; });
      persist();
      render();
    },
    toggleMenu: function(){
      menuOpen = !menuOpen;
      render();
    },
    setViewFromMenu: function(v){
      menuOpen = false;
      App.setView(v);
    },
    calendarMonthShift: function(dir){
      ensureCalendarMonth();
      calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth()+dir, 1);
      render();
    },
    calendarDayClick: function(dateStr){
      activeDate = dateStr;
      var sessMap = datesWithSessionsInfo();
      var info = sessMap[dateStr];
      if(info && info.day && data.plan.days[info.day]){
        activeDay = info.day;
      } else {
        var idx = new Date(dateStr+'T00:00:00').getDay();
        var found = data.plan.order.find(function(k){ return data.plan.days[k].weekday === idx; });
        if(found) activeDay = found;
      }
      view = 'log';
      render();
    },
    setMeasDate: function(v){ measDate = v; render(); },
    addMeasurementDef: function(){
      var input = document.getElementById('newMeasName');
      var name = (input && input.value ? input.value : '').trim();
      if(!name) return;
      data.measurements.defs.push({id: genId('meas'), label:name});
      persist();
      render();
    },
    removeMeasurementDef: function(id){
      var def = data.measurements.defs.find(function(d){ return d.id===id; });
      if(!confirm('Remove "'+(def?def.label:'this measurement')+'"? Past logged values for it will no longer be shown.')) return;
      data.measurements.defs = data.measurements.defs.filter(function(d){ return d.id!==id; });
      persist();
      render();
    },
    renameMeasurementDef: function(id, value){
      var def = data.measurements.defs.find(function(d){ return d.id===id; });
      if(def) def.label = (value||'').trim() || def.label;
      persist();
      render();
    },
    saveMeasurements: function(){
      var entry = {};
      data.measurements.defs.forEach(function(def){
        var el = document.getElementById('meas-'+def.id);
        var v = el ? el.value : '';
        if(v!=='') entry[def.id] = parseFloat(v);
      });
      data.measurements.entries[measDate] = entry;
      persist().then(function(result){
        render();
        var toast = document.getElementById('measToast');
        if(!result.ok){
          if(toast){ toast.style.color='var(--bad)'; toast.textContent = "Couldn't save: "+result.error; }
          return;
        }
        if(toast){ toast.style.color='var(--good)'; toast.textContent = 'Measurements saved ✓'; }
        setTimeout(function(){
          var t = document.getElementById('measToast');
          if(t) t.textContent = '';
        }, 4000);
      });
    },
    downloadTextExport: function(){
      downloadFile('training-log-'+todayISO()+'.txt', buildTextExport(), 'text/plain');
    },
    downloadJSONExport: function(){
      downloadFile('training-log-'+todayISO()+'.json', JSON.stringify(data, null, 2), 'application/json');
    },
    showTextExport: function(){
      var box = document.getElementById('exportTextBox');
      if(!box) return;
      box.innerHTML = '<textarea class="backup-textarea" readonly id="exportTA" style="min-height:320px;">'+buildTextExport()+'</textarea>';
      var ta = document.getElementById('exportTA');
      ta.focus();
      ta.select();
    },
    logout: function(){
      auth.signOut();
    }
  };

  if(configOk && !sdkLoadError){
    auth.onAuthStateChanged(function(user){
      authChecked = true;
      currentUser = user;
      if(user){
        loadData().then(function(d){
          data = d;
          if(!activeDay || !data.plan.days[activeDay]) activeDay = computeDefaultDay();
          render();
          persist();
        });
      } else {
        data = null;
        render();
      }
    });
  } else {
    render();
  }
})();
</script>
</body>
</html>
